<div class="settings-page">
<div class="settings-container">

    <div class="page-head">
        <h1 class="page-title">设置</h1>
    </div>

    <!-- 外观 -->
    <section class="setting-card">
        <div class="card-header"><h3>外观</h3></div>
        <div class="card-body">
            <div class="settings-option column">
                <div class="option-info">
                    <span class="option-title">主题模式</span>
                    <p class="option-desc">在浅色与深色外观之间切换</p>
                </div>
                <div class="option-control full">
                    <div class="theme-switch">
                        <button type="button" class="theme-option" data-mode="dark">深色</button>
                        <button type="button" class="theme-option" data-mode="light">浅色</button>
                    </div>
                </div>
            </div>
            <div class="settings-option column">
                <div class="option-info">
                    <span class="option-title">主题配色</span>
                    <p class="option-desc">自定义应用的主色调，所有页面即时生效</p>
                </div>
                <div class="option-control full">
                    <div class="theme-swatches" id="themeSwatches">
                        <button type="button" class="swatch" data-color="#7c83ff" style="--sw:#7c83ff" title="默认紫罗兰"></button>
                        <button type="button" class="swatch" data-color="#5b8cff" style="--sw:#5b8cff" title="星空蓝"></button>
                        <button type="button" class="swatch" data-color="#33c9c9" style="--sw:#33c9c9" title="青碧"></button>
                        <button type="button" class="swatch" data-color="#3ecf8e" style="--sw:#3ecf8e" title="翠绿"></button>
                        <button type="button" class="swatch" data-color="#ff7eb6" style="--sw:#ff7eb6" title="樱粉"></button>
                        <button type="button" class="swatch" data-color="#ff9f45" style="--sw:#ff9f45" title="暖橙"></button>
                        <button type="button" class="swatch swatch-custom" id="customSwatch" title="自定义颜色"></button>
                    </div>
                </div>
            </div>
            <div class="settings-option column">
                <div class="option-info">
                    <label class="option-title" for="background-path">背景图片</label>
                    <p class="option-desc">选择一张图片作为应用背景</p>
                </div>
                <div class="option-control full">
                    <input type="text" id="background-path" readonly required>
                    <button type="button" id="browse-background">选择图片</button>
                </div>
            </div>
            <div class="settings-option column">
                <div class="option-info">
                <label class="option-title" for="backgroundOpacityInput">背景亮度</label>
                <p class="option-desc">拖动滑块调整背景的明暗程度<span class="range-value" id="backgroundOpacityValue">50%</span></p>
            </div>
            <div class="option-control full">
                <input type="range" id="backgroundOpacityInput" min="0" max="1" step="0.001" />
                </div>
            </div>
            <div class="settings-option">
                <div class="option-info">
                    <span class="option-title">恢复默认背景</span>
                </div>
                <div class="option-control">
                    <button type="button" id="restore-defaults" class="secondary">恢复默认</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 数据 -->
    <section class="setting-card">
        <div class="card-header"><h3>数据</h3></div>
        <div class="card-body">
            <div class="settings-option column">
                <div class="option-info">
                    <label class="option-title" for="game-path">鸣潮游戏目录</label>
                    <p class="option-desc">用于不启动启动器也能读取本地账号状态，请点击「选择目录」指定你本机的游戏路径</p>
                </div>
                <div class="option-control full">
                    <input type="text" id="game-path" readonly required>
                    <div class="btn-row">
                        <button type="button" id="browse-game-path" class="secondary">选择目录</button>
                        <button type="button" id="reset-game-path" class="secondary">恢复默认</button>
                    </div>
                </div>
            </div>
            <div class="settings-option column">
                <div class="option-info">
                    <label class="option-title" for="dataFile-path">数据文件夹</label>
                    <p class="option-desc">更改后会自动重启应用</p>
                </div>
                <div class="option-control full">
                    <input type="text" id="dataFile-path" readonly required>
                    <div class="btn-row">
                        <button type="button" id="browse-dataFile" class="secondary">更换路径</button>
                        <button type="button" id="reset-dataFile" class="secondary">恢复默认</button>
                    </div>
                </div>
            </div>
            <div class="settings-option">
                <div class="option-info">
                    <span class="option-title">头像文件夹</span>
                    <p class="option-desc">打开本地角色与武器头像目录</p>
                </div>
                <div class="option-control">
                    <button id="openAvatarFolder">打开</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 系统 -->
    <section class="setting-card">
        <div class="card-header"><h3>系统</h3></div>
        <div class="card-body">
            <div class="settings-option column">
                <div class="option-info">
                    <span class="option-title">关闭程序窗口</span>
                    <p class="option-desc">点击 × 关闭窗口时的行为</p>
                </div>
                <div class="option-control full">
                    <div class="theme-switch" id="closeActionSwitch">
                        <button type="button" class="theme-option" data-action="exit">退出程序</button>
                        <button type="button" class="theme-option" data-action="tray">系统托盘</button>
                    </div>
                </div>
            </div>
            <div class="settings-option column">
                <div class="option-info">
                    <span class="option-title">版本更新</span>
                    <p class="option-desc">当前版本 <span id="currentVersion">1.0.0</span> · 前往 GitHub 检查最新发布</p>
                </div>
                <div class="option-control full">
                    <div class="btn-row">
                        <button type="button" id="check-update">检查更新</button>
                        <a id="update-link" class="update-link hidden" href="https://github.com/Untsia/FeibiJiubi/releases/latest" target="_blank" rel="noopener">前往下载</a>
                    </div>
                    <p class="option-status" id="updateStatus"></p>
                </div>
            </div>
        </div>
    </section>

</div>
<div class="color-picker-pop" id="colorPickerPop" hidden>
    <div class="cpp-header">自定义主色</div>
    <div class="cpp-preview" id="cppPreview"></div>
    <div class="cpp-sliders">
        <div class="cpp-row"><span class="cpp-label">色相</span><input type="range" id="cppHue" min="0" max="360" value="248"><span class="cpp-val" id="cppHueVal">248</span></div>
        <div class="cpp-row"><span class="cpp-label">饱和</span><input type="range" id="cppSat" min="0" max="100" value="89"><span class="cpp-val" id="cppSatVal">89</span></div>
        <div class="cpp-row"><span class="cpp-label">明度</span><input type="range" id="cppLight" min="0" max="100" value="66"><span class="cpp-val" id="cppLightVal">66</span></div>
    </div>
    <div class="cpp-presets" id="cppPresets"></div>
    <div class="cpp-hexrow"><span class="cpp-hash">#</span><input type="text" id="cppHex" maxlength="6" spellcheck="false" value="7c83ff"></div>
    <div class="cpp-actions">
        <button type="button" class="cpp-btn cpp-cancel" id="cppCancel">取消</button>
        <button type="button" class="cpp-btn cpp-apply" id="cppApply">应用</button>
    </div>
</div>
</div>

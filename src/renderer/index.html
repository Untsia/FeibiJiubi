<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菲比啾比</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/settings.css">
    <script src="scripts/gameTools/gacha.js"></script>
    <script src="scripts/tools/syncNotification.js"></script>
    <script src="scripts/tools/modalManager.js"></script>
    <script src="./scripts/import/chart.js"></script>
</head>
<body>
    <div class="aurora-bg" aria-hidden="true"></div>
    <header class="title-bar">
        <div class="title-brand">
            <img src="../assets/icon.png" class="title-brand-logo" alt="菲比啾比" />
            <span class="title-brand-name">菲比啾比</span>
        </div>
        <div class="window-controls">
            <span id="minimize" class="control-button" title="最小化" aria-label="最小化">
                <svg width="13" height="13" viewBox="0 0 13 13"><line x1="2.5" y1="6.5" x2="10.5" y2="6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </span>
            <span id="maximize" class="control-button" title="最大化" aria-label="最大化">
                <svg width="13" height="13" viewBox="0 0 13 13"><rect x="3" y="3" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            </span>
            <span id="close" class="control-button" title="关闭" aria-label="关闭">
                <svg width="13" height="13" viewBox="0 0 13 13"><line x1="3.5" y1="3.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="9.5" y1="3.5" x2="3.5" y2="9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </span>
        </div>
    </header>

    <div class="container">
        <nav class="sidebar">
            <ul>
                <li class="nav-item active" data-page="gameTools" data-view="analysis">
                    <span class="nav-ico" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3v18h18"/>
                            <path d="M19 9l-5 5-4-4-3 3"/>
                        </svg>
                    </span>
                    <span class="nav-label">分析</span>
                </li>
                <li class="nav-item" data-page="gameTools" data-view="qizang">
                    <span class="nav-ico" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                    </span>
                    <span class="nav-label">奇藏</span>
                </li>
                <li class="nav-item" data-page="gameTools" data-view="level">
                    <span class="nav-ico" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 20h18"/>
                            <path d="M4 16l4-4 4 3 8-8"/>
                            <path d="M16 7h4v4"/>
                        </svg>
                    </span>
                    <span class="nav-label">等级</span>
                </li>
            </ul>
            <div class="sidebar-bottom">
                <button class="sb-btn theme-toggle" id="sidebar-theme-toggle" type="button" aria-label="切换浅色/深色">
                    <span class="nav-ico" aria-hidden="true">
                        <svg class="ico-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="ico-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </span>
                </button>
                <button class="sb-btn sidebar-settings" data-page="settings" type="button" aria-label="设置">
                    <span class="nav-ico" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </span>
                </button>
            </div>
        </nav>
        <main id="content" class="content"></main>
    </div>
    <!-- 启动时发现新版本提示 -->
    <div id="update-modal" class="modal">
        <div class="modal-content update-modal-card">
            <div class="modal-header update-modal-header">
                <span class="update-modal-icon">✨</span>
                <span>发现新版本</span>
            </div>
            <div class="modal-body update-modal-body">
                <div class="update-version-row">
                    <span class="update-badge" id="update-current">当前 v1.2.1</span>
                    <span class="update-arrow">→</span>
                    <span class="update-badge update-badge-new" id="update-latest">v1.4.0</span>
                </div>
                <p class="update-modal-text" id="update-desc">菲比啾比已发布新版本，点击「立即更新」可在程序内一键完成下载与安装，无需手动操作。</p>
                <div class="update-progress" id="update-progress" style="display:none;">
                    <div class="update-progress-bar"><div class="update-progress-fill" id="update-progress-fill"></div></div>
                    <div class="update-progress-meta">
                        <span id="update-progress-pct">0%</span>
                        <span id="update-progress-speed"></span>
                    </div>
                </div>
            </div>
            <div class="modal-footer update-modal-footer">
                <button type="button" id="update-later" class="modal-button modal-button-ghost">稍后</button>
                <button type="button" id="update-go" class="modal-button modal-button-primary">立即更新</button>
            </div>
        </div>
    </div>

    <script src="scripts/background.js"></script>
    <script src="scripts/renderer.js"></script>
</body>
</html>
